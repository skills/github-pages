<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TETRIS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cell: 28px;
      --bg: #0b0b1a;
      --panel: #12122a;
      --border: #2a2a55;
      --cyan: #00f0f0;
      --orange: #ff6600;
      --red: #ff2244;
      --text: #ccccee;
      --dim: #555577;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Press Start 2P', 'Courier New', monospace;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      padding: 6px 8px 4px;
      gap: 5px;
    }

    /* ── HEADER ─────────────────────────── */
    #header {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 5px;
      background: linear-gradient(90deg, #f00, #f80, #ff0, #0f0, #0ff, #88f, #f0f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #hud {
      display: flex;
      gap: 8px;
    }

    .hud-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      text-align: center;
      min-width: 72px;
    }

    .hud-label {
      font-size: 0.38rem;
      color: var(--dim);
      letter-spacing: 2px;
    }

    .hud-value {
      font-size: 0.85rem;
      color: var(--cyan);
      margin-top: 2px;
    }

    /* ── GAME AREA ──────────────────────── */
    #game-area {
      display: flex;
      gap: 6px;
      align-items: flex-start;
      justify-content: center;
      flex-shrink: 0;
    }

    #canvas-container {
      position: relative;
      border: 2px solid var(--border);
      border-radius: 4px;
      line-height: 0;
      box-shadow: 0 0 16px rgba(0,240,240,0.1);
    }

    canvas { display: block; }

    #side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .side-label {
      font-size: 0.35rem;
      color: var(--dim);
      letter-spacing: 2px;
    }

    #next-canvas {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    /* ── OVERLAY ───────────────────────── */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.88);
      border-radius: 2px;
      gap: 16px;
      z-index: 10;
    }
    #overlay.hidden { display: none; }

    #overlay-title {
      font-size: 1rem;
      color: var(--cyan);
      letter-spacing: 3px;
      text-align: center;
    }

    #overlay-score {
      font-size: 0.55rem;
      color: var(--dim);
      text-align: center;
      line-height: 1.8;
    }
    #overlay-score span { color: #ffdd00; }

    #overlay-btn {
      background: transparent;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      padding: 10px 20px;
      cursor: pointer;
      letter-spacing: 2px;
      border-radius: 2px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    #overlay-btn:active { background: rgba(0,240,240,0.15); }

    /* ── CONTROLS ─────────────────────── */
    #controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 8px;
      flex: 1;
      justify-content: flex-end;
      padding-bottom: 6px;
    }

    #pause-bar {
      display: flex;
      justify-content: center;
    }

    #btn-pause {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.38rem;
      letter-spacing: 1px;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 10px;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-pause:active { background: #1e1e40; }

    #ctrl-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 0 14px;
    }

    /* ── DPAD ─────────────────────────── */
    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 3px;
    }

    .dpad-btn {
      background: #1c1c38;
      border: 2px solid #2e2e60;
      border-radius: 8px;
      color: #aaaacc;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      transition: background 0.08s, transform 0.08s;
    }
    .dpad-btn:active, .dpad-btn.pressed {
      background: #2c2c58;
      border-color: #5555aa;
      transform: scale(0.93);
    }

    .dpad-corner { visibility: hidden; }

    #dpad-center {
      background: #161628;
      border: 2px solid #222244;
      border-radius: 50%;
      cursor: default;
    }

    /* ── ACTION BUTTONS ──────────────── */
    #action-btns {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .action-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: none;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      transition: transform 0.08s, box-shadow 0.08s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
      line-height: 1;
    }

    #btn-rotate {
      background: radial-gradient(circle at 35% 35%, #22ddff, #0088bb);
      color: #fff;
      box-shadow: 0 4px 0 #005577, 0 0 14px rgba(0,200,255,0.4);
    }
    #btn-rotate:active, #btn-rotate.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #005577, 0 0 14px rgba(0,200,255,0.4);
    }

    #btn-fast {
      background: radial-gradient(circle at 35% 35%, #ff8833, #cc3300);
      color: #fff;
      box-shadow: 0 4px 0 #881100, 0 0 14px rgba(255,100,0,0.4);
    }
    #btn-fast:active, #btn-fast.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #881100, 0 0 14px rgba(255,100,0,0.4);
    }

    .btn-sub {
      font-size: 0.42rem;
      opacity: 0.75;
    }

    #speed-bar-wrap {
      width: 100%;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    #speed-label {
      font-size: 0.35rem;
      color: var(--dim);
      letter-spacing: 2px;
    }
    #speed-bar-bg {
      height: 5px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    #speed-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f0f0, #ff0066);
      border-radius: 3px;
      transition: width 0.4s;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <h1>TETRIS</h1>
    <div id="hud">
      <div class="hud-box">
        <div class="hud-label">SCORE</div>
        <div class="hud-value" id="score-val">0</div>
      </div>
    </div>
  </div>

  <!-- GAME AREA -->
  <div id="game-area">
    <div id="canvas-container">
      <canvas id="board"></canvas>
      <!-- Overlay -->
      <div id="overlay">
        <div id="overlay-title">TETRIS</div>
        <div id="overlay-score" style="display:none">
          SCORE<br><span id="final-score">0</span>
        </div>
        <button id="overlay-btn">JOUER</button>
      </div>
    </div>
    <div id="side">
      <div class="side-label">NEXT</div>
      <canvas id="next-canvas"></canvas>
    </div>
  </div>

  <!-- CONTROLS -->
  <div id="controls">

    <div id="speed-bar-wrap">
      <div id="speed-label">VITESSE ▸</div>
      <div id="speed-bar-bg"><div id="speed-bar-fill"></div></div>
    </div>

    <div id="pause-bar">
      <button id="btn-pause">⏸ PAUSE</button>
    </div>

    <div id="ctrl-row">

      <!-- D-PAD -->
      <div id="dpad">
        <div class="dpad-corner"></div>
        <button class="dpad-btn" id="btn-up">▲</button>
        <div class="dpad-corner"></div>
        <button class="dpad-btn" id="btn-left">◀</button>
        <div class="dpad-btn dpad-corner" id="dpad-center"></div>
        <button class="dpad-btn" id="btn-right">▶</button>
        <div class="dpad-corner"></div>
        <button class="dpad-btn" id="btn-down">▼</button>
        <div class="dpad-corner"></div>
      </div>

      <!-- ACTION BUTTONS -->
      <div id="action-btns">
        <button class="action-btn" id="btn-rotate">
          ↻
          <span class="btn-sub">TOUR</span>
        </button>
        <button class="action-btn" id="btn-fast">
          ▼▼
          <span class="btn-sub">VITE</span>
        </button>
      </div>

    </div>
  </div>

</div>

<script>
(() => {
  'use strict';

  // ── Constants ──────────────────────────────────────────────────────
  const COLS = 10, ROWS = 20;
  const LOCK_DELAY = 450;
  const FAST_INTERVAL = 45; // ms per cell when fast-drop held

  const COLORS = [
    null,
    '#00f0f0', // I  cyan
    '#f0c000', // O  yellow
    '#a020f0', // T  purple
    '#00e000', // S  green
    '#f02020', // Z  red
    '#2020f0', // J  blue
    '#f07800', // L  orange
  ];

  const PIECES = [
    null,
    [[1,1,1,1]],
    [[2,2],[2,2]],
    [[0,3,0],[3,3,3]],
    [[0,4,4],[4,4,0]],
    [[5,5,0],[0,5,5]],
    [[6,0,0],[6,6,6]],
    [[0,0,7],[7,7,7]],
  ];

  // ── Canvas setup ────────────────────────────────────────────────────
  const boardEl  = document.getElementById('board');
  const ctx      = boardEl.getContext('2d');
  const nextEl   = document.getElementById('next-canvas');
  const nctx     = nextEl.getContext('2d');

  let CELL = 28;

  function calcCell() {
    const app = document.getElementById('app');
    const sideW = 68; // next panel + gap
    const availW = Math.min(app.clientWidth - sideW - 16, 300);
    return Math.max(16, Math.floor(availW / COLS));
  }

  function resizeCanvases() {
    CELL = calcCell();
    boardEl.width  = CELL * COLS;
    boardEl.height = CELL * ROWS;
    nextEl.width   = CELL * 4;
    nextEl.height  = CELL * 4;
  }

  resizeCanvases();
  window.addEventListener('resize', () => { resizeCanvases(); draw(); drawNext(); });

  // ── Game state ──────────────────────────────────────────────────────
  let grid, score, state; // state: idle|playing|paused|gameover
  let current, curX, curY, nextPiece;
  let lockPending = false, lockTimer = null;
  let animFrame, lastTime = 0, dropAccum = 0;
  let fastDropActive = false, fastInterval = null;

  // Speed: dropInterval = max(80, 1000 - score * 22) ms
  function dropInterval() {
    return Math.max(80, 1000 - score * 22);
  }

  // Speed fill bar: 0–100% when interval goes 1000→80
  function speedPct() {
    return Math.min(100, Math.round((1000 - dropInterval()) / 9.2));
  }

  function newGrid() {
    return Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
  }

  function randPiece() {
    const id = Math.ceil(Math.random() * 7);
    return PIECES[id].map(r => [...r]);
  }

  function initGame() {
    grid = newGrid();
    score = 0;
    updateHUD();
    nextPiece = randPiece();
    spawnPiece();
    state = 'playing';
    lastTime = 0; dropAccum = 0;
    cancelAnimationFrame(animFrame);
    animFrame = requestAnimationFrame(loop);
  }

  function spawnPiece() {
    current = nextPiece;
    nextPiece = randPiece();
    curX = Math.floor((COLS - current[0].length) / 2);
    curY = 0;
    lockPending = false;
    if (collides(current, curX, curY)) {
      state = 'gameover';
      showOverlay('GAME OVER', true);
    }
    drawNext();
  }

  // ── Collision ───────────────────────────────────────────────────────
  function collides(piece, px, py) {
    for (let r = 0; r < piece.length; r++)
      for (let c = 0; c < piece[r].length; c++)
        if (piece[r][c]) {
          const nx = px + c, ny = py + r;
          if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
          if (ny >= 0 && grid[ny][nx]) return true;
        }
    return false;
  }

  // ── Rotation (with wall kicks) ──────────────────────────────────────
  function rotate(piece) {
    const rows = piece.length, cols = piece[0].length;
    const res = Array.from({ length: cols }, () => new Array(rows).fill(0));
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        res[c][rows - 1 - r] = piece[r][c];
    return res;
  }

  function tryRotate() {
    const rot = rotate(current);
    for (const k of [0, -1, 1, -2, 2]) {
      if (!collides(rot, curX + k, curY)) {
        current = rot;
        curX += k;
        onMove();
        return;
      }
    }
  }

  // ── Movement ────────────────────────────────────────────────────────
  function moveLeft()  { if (!collides(current, curX-1, curY)) { curX--; onMove(); } }
  function moveRight() { if (!collides(current, curX+1, curY)) { curX++; onMove(); } }

  function moveDown() {
    if (!collides(current, curX, curY+1)) {
      curY++;
      lockPending = false;
      return true;
    }
    scheduleLock();
    return false;
  }

  function onMove() {
    if (!collides(current, curX, curY+1)) lockPending = false;
    else scheduleLock();
  }

  function scheduleLock() {
    if (!lockPending) {
      lockPending = true;
      clearTimeout(lockTimer);
      lockTimer = setTimeout(lockPiece, LOCK_DELAY);
    }
  }

  function lockPiece() {
    lockPending = false;
    for (let r = 0; r < current.length; r++)
      for (let c = 0; c < current[r].length; c++)
        if (current[r][c] && curY + r >= 0)
          grid[curY + r][curX + c] = current[r][c];
    clearLines();
    spawnPiece();
  }

  function clearLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; ) {
      if (grid[r].every(v => v)) {
        grid.splice(r, 1);
        grid.unshift(new Array(COLS).fill(0));
        cleared++;
      } else r--;
    }
    if (cleared) {
      score += cleared; // 1 point per line
      updateHUD();
    }
  }

  // ── Fast drop (hold button) ─────────────────────────────────────────
  function startFastDrop() {
    if (fastDropActive) return;
    fastDropActive = true;
    moveDown();
    fastInterval = setInterval(() => {
      if (state !== 'playing') return stopFastDrop();
      moveDown();
    }, FAST_INTERVAL);
  }

  function stopFastDrop() {
    fastDropActive = false;
    clearInterval(fastInterval);
    fastInterval = null;
  }

  // ── Ghost ───────────────────────────────────────────────────────────
  function ghostY() {
    let gy = curY;
    while (!collides(current, curX, gy+1)) gy++;
    return gy;
  }

  // ── Drawing ─────────────────────────────────────────────────────────
  function drawBlock(c, x, y, alpha = 1, targetCtx = ctx, cell = CELL) {
    if (!c) return;
    const col = COLORS[c];
    targetCtx.globalAlpha = alpha;
    targetCtx.fillStyle = col;
    targetCtx.fillRect(x*cell+1, y*cell+1, cell-2, cell-2);
    // highlight top edge
    targetCtx.fillStyle = 'rgba(255,255,255,0.3)';
    targetCtx.fillRect(x*cell+1, y*cell+1, cell-2, Math.max(2, Math.floor(cell/8)));
    // shadow bottom edge
    targetCtx.fillStyle = 'rgba(0,0,0,0.35)';
    targetCtx.fillRect(x*cell+1, (y+1)*cell - Math.max(2, Math.floor(cell/8))-1, cell-2, Math.max(2, Math.floor(cell/8)));
    targetCtx.globalAlpha = 1;
  }

  function draw() {
    resizeCanvases();
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, boardEl.width, boardEl.height);

    // grid lines
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 0.5;
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c*CELL,0); ctx.lineTo(c*CELL,boardEl.height); ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0,r*CELL); ctx.lineTo(boardEl.width,r*CELL); ctx.stroke();
    }

    // locked blocks
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        drawBlock(grid[r][c], c, r);

    if (state === 'playing' || state === 'paused') {
      // ghost
      const gy = ghostY();
      for (let r = 0; r < current.length; r++)
        for (let c = 0; c < current[r].length; c++)
          if (current[r][c])
            drawBlock(current[r][c], curX+c, gy+r, 0.15);
      // current piece
      for (let r = 0; r < current.length; r++)
        for (let c = 0; c < current[r].length; c++)
          if (current[r][c])
            drawBlock(current[r][c], curX+c, curY+r);
    }
  }

  function drawNext() {
    const cell = Math.floor(nextEl.width / 4);
    nctx.fillStyle = '#0a0a1e';
    nctx.fillRect(0, 0, nextEl.width, nextEl.height);
    if (!nextPiece) return;
    const ox = Math.floor((4 - nextPiece[0].length) / 2);
    const oy = Math.floor((4 - nextPiece.length) / 2);
    for (let r = 0; r < nextPiece.length; r++)
      for (let c = 0; c < nextPiece[r].length; c++)
        drawBlock(nextPiece[r][c], ox+c, oy+r, 1, nctx, cell);
  }

  // ── HUD ─────────────────────────────────────────────────────────────
  function updateHUD() {
    document.getElementById('score-val').textContent = score;
    document.getElementById('speed-bar-fill').style.width = speedPct() + '%';
  }

  // ── Overlay ─────────────────────────────────────────────────────────
  const overlay     = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayScore = document.getElementById('overlay-score');
  const finalScore  = document.getElementById('final-score');
  const overlayBtn  = document.getElementById('overlay-btn');

  function showOverlay(title, showScore = false) {
    overlayTitle.textContent = title;
    if (showScore) {
      overlayScore.style.display = 'block';
      finalScore.textContent = score;
    } else {
      overlayScore.style.display = 'none';
    }
    overlayBtn.textContent = showScore ? 'REJOUER' : 'JOUER';
    overlay.classList.remove('hidden');
  }

  function hideOverlay() { overlay.classList.add('hidden'); }

  overlayBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    hideOverlay();
    initGame();
  });

  // ── Pause ───────────────────────────────────────────────────────────
  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      overlayTitle.textContent = 'PAUSE';
      overlayScore.style.display = 'none';
      overlayBtn.textContent = 'REPRENDRE';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
      lastTime = performance.now();
      animFrame = requestAnimationFrame(loop);
    }
  }

  document.getElementById('btn-pause').addEventListener('pointerdown', e => {
    e.preventDefault();
    togglePause();
  });

  // ── Game loop ────────────────────────────────────────────────────────
  function loop(ts) {
    if (state !== 'playing') { draw(); return; }
    const dt = ts - lastTime;
    lastTime = ts;
    // don't count fast-drop ticks in auto-drop accumulator
    if (!fastDropActive) {
      dropAccum += dt;
      if (dropAccum >= dropInterval()) {
        dropAccum = 0;
        moveDown();
      }
    } else {
      dropAccum = 0;
    }
    draw();
    animFrame = requestAnimationFrame(loop);
  }

  // ── Keyboard (desktop) ───────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (state !== 'playing' && e.key !== 'p' && e.key !== 'P') return;
    switch (e.key) {
      case 'ArrowLeft':  e.preventDefault(); moveLeft(); break;
      case 'ArrowRight': e.preventDefault(); moveRight(); break;
      case 'ArrowUp':    e.preventDefault(); tryRotate(); break;
      case 'ArrowDown':  e.preventDefault(); moveDown(); break;
      case ' ':          e.preventDefault(); startFastDrop(); break;
      case 'p': case 'P': togglePause(); break;
    }
    draw();
  });
  document.addEventListener('keyup', e => {
    if (e.key === ' ') stopFastDrop();
  });

  // ── Button helpers ───────────────────────────────────────────────────
  function bindBtn(id, onDown, onUp = null, repeat = false) {
    const el = document.getElementById(id);
    let iv;
    const down = e => {
      e.preventDefault();
      if (state !== 'playing') return;
      el.classList.add('pressed');
      onDown();
      if (repeat) iv = setInterval(onDown, 110);
    };
    const up = e => {
      el.classList.remove('pressed');
      clearInterval(iv);
      if (onUp) onUp();
    };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('pointercancel', up);
  }

  bindBtn('btn-left',  moveLeft,    null, true);
  bindBtn('btn-right', moveRight,   null, true);
  bindBtn('btn-down',  moveDown,    null, true);
  bindBtn('btn-up',    tryRotate);          // D-pad up = rotate (classic)
  bindBtn('btn-rotate', tryRotate);         // A button = rotate
  bindBtn('btn-fast',  startFastDrop, stopFastDrop); // B button = fast drop

  // ── Init ─────────────────────────────────────────────────────────────
  state = 'idle';
  grid = newGrid();
  nextPiece = randPiece();
  drawNext();
  draw();
  showOverlay('TETRIS');

})();
</script>
</body>
</html>
