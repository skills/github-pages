<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TETRIS">
  <meta name="theme-color" content="#00f0f0">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
  <title>TETRIS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0b1a;
      --panel: #12122a;
      --border: #2a2a55;
      --cyan: #00f0f0;
      --text: #ccccee;
      --dim: #555577;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Press Start 2P', 'Courier New', monospace;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ══ PORTRAIT ═══════════════════════════════════════════════════ */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      position: relative; /* ancre les overlays positionnés en absolute */
    }

    #panel-center {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 8px 4px;
      gap: 5px;
      overflow: hidden;
    }

    #controls-row {
      flex: 0 0 auto;
      display: flex;
      width: 100%;
    }

    #panel-left {
      flex: 0 0 55%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4px 0 8px 14px;
      gap: 4px;
    }

    #panel-right {
      flex: 0 0 45%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 14px 8px 0;
    }

    /* ── HEADER ─────────────────────────── */
    #header {
      display: flex;
      width: 100%;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 5px;
      background: linear-gradient(90deg, #f00, #f80, #ff0, #0f0, #0ff, #88f, #f0f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #hud { display: flex; gap: 8px; }

    .hud-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      text-align: center;
      min-width: 72px;
    }

    .hud-label { font-size: 0.38rem; color: var(--dim); letter-spacing: 2px; }
    .hud-value { font-size: 0.85rem; color: var(--cyan); margin-top: 2px; }

    /* ── GAME AREA ──────────────────────── */
    #game-area {
      display: flex;
      gap: 6px;
      align-items: flex-start;
      justify-content: center;
      flex-shrink: 0;
    }

    #canvas-container {
      position: relative;
      border: 2px solid var(--border);
      border-radius: 4px;
      line-height: 0;
      box-shadow: 0 0 16px rgba(0,240,240,0.1);
    }

    canvas { display: block; }

    #side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .side-label { font-size: 0.35rem; color: var(--dim); letter-spacing: 2px; }

    #next-canvas {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    /* ── OVERLAY ───────────────────────── */
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.88);
      border-radius: 2px;
      gap: 16px;
      z-index: 10;
    }
    #overlay.hidden { display: none; }

    #overlay-title { font-size: 1rem; color: var(--cyan); letter-spacing: 3px; text-align: center; }
    #overlay-score { font-size: 0.55rem; color: var(--dim); text-align: center; line-height: 1.8; }
    #overlay-score span { color: #ffdd00; }

    #overlay-btn {
      background: transparent;
      border: 2px solid var(--cyan);
      color: var(--cyan);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.65rem;
      padding: 10px 20px;
      cursor: pointer;
      letter-spacing: 2px;
      border-radius: 2px;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s;
    }
    #overlay-btn:active { background: rgba(0,240,240,0.15); }

    /* ── PAUSE BAR ─────────────────────── */
    #pause-bar { display: flex; justify-content: center; width: 100%; }

    #btn-pause {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.38rem;
      letter-spacing: 1px;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 10px;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-pause:active { background: #1e1e40; }

    /* ── SPEED BAR ─────────────────────── */
    #speed-bar-wrap { width: 100%; display: flex; flex-direction: column; gap: 3px; }
    #speed-label { font-size: 0.35rem; color: var(--dim); letter-spacing: 2px; }
    #speed-bar-bg {
      height: 5px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }
    #speed-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f0f0, #ff0066);
      border-radius: 3px;
      transition: width 0.4s;
    }

    /* ── DPAD ─────────────────────────── */
    #dpad {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      grid-template-rows: repeat(3, 46px);
      gap: 3px;
    }

    .dpad-btn {
      background: #1c1c38;
      border: 2px solid #2e2e60;
      border-radius: 8px;
      color: #aaaacc;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      transition: background 0.08s, transform 0.08s;
    }
    .dpad-btn:active, .dpad-btn.pressed {
      background: #2c2c58;
      border-color: #5555aa;
      transform: scale(0.93);
    }

    /* Bouton bas = chute rapide, couleur orange distinctif */
    #btn-down {
      background: #221508;
      border-color: #7a3a10;
      color: #ff9944;
      font-size: 0.85rem;
    }
    #btn-down:active, #btn-down.pressed {
      background: #3a2010;
      border-color: #dd6600;
    }

    .dpad-corner { visibility: hidden; }

    #dpad-center {
      background: #161628;
      border: 2px solid #222244;
      border-radius: 50%;
      cursor: default;
    }

    .dpad-hint {
      font-size: 0.27rem;
      color: #7a4a20;
      letter-spacing: 1px;
      text-align: center;
    }

    /* ── ACTION BUTTONS ──────────────── */
    #action-btns {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .action-btn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: none;
      font-family: 'Press Start 2P', monospace;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      transition: transform 0.08s, box-shadow 0.08s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 2px;
      line-height: 1;
    }

    #btn-rotate {
      background: radial-gradient(circle at 35% 35%, #22ddff, #0088bb);
      color: #fff;
      box-shadow: 0 4px 0 #005577, 0 0 14px rgba(0,200,255,0.4);
    }
    #btn-rotate:active, #btn-rotate.pressed {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #005577, 0 0 14px rgba(0,200,255,0.4);
    }

    .btn-sub { font-size: 0.42rem; opacity: 0.75; }

    /* ── ÉCRAN ROTATION ───────────────────────────────────────────── */
    #rotate-screen {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: none; /* affiché par JS en portrait */
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    #rotate-screen.visible { display: flex; }

    #rotate-icon {
      width: 90px;
      height: 90px;
      animation: phone-turn 2.4s ease-in-out infinite;
      filter: drop-shadow(0 0 10px #00f0f0);
    }
    @keyframes phone-turn {
      0%, 20%  { transform: rotate(0deg);   }
      55%, 75% { transform: rotate(-90deg); }
      100%     { transform: rotate(0deg);   }
    }

    #rotate-label {
      font-size: 0.55rem;
      color: var(--cyan);
      letter-spacing: 3px;
      text-align: center;
      line-height: 2;
    }
    #rotate-sub {
      font-size: 0.32rem;
      color: var(--dim);
      letter-spacing: 2px;
      text-align: center;
    }
    #btn-continue-portrait {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: 'Press Start 2P', monospace;
      font-size: 0.3rem;
      letter-spacing: 1px;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 10px;
      -webkit-tap-highlight-color: transparent;
      margin-top: 6px;
    }
    #btn-continue-portrait:active { background: #1e1e40; }

    /* ── COMBO OVERLAY (plein app) ────────────────────────────────── */
    #combo-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 30;
    }
    #combo-overlay.hidden { opacity: 0; visibility: hidden; }

    #combo-text {
      font-family: 'Press Start 2P', monospace;
      font-weight: bold;
      text-align: center;
      line-height: 1.1;
    }
    #combo-pts {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.9rem;
      color: #fff;
      margin-top: 8px;
      text-align: center;
      opacity: 0.9;
    }

    @keyframes combo-fade {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      65%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes combo-zoom {
      0%   { transform: scale(2.4); }
      12%  { transform: scale(1);   }
      65%  { transform: scale(1);   }
      100% { transform: scale(0.85) translateY(-12px); }
    }

    /* ══ PAYSAGE ════════════════════════════════════════════════════ */
    @media (orientation: landscape) {
      #app {
        flex-direction: row;
        align-items: stretch;
        max-width: 100%;
        height: 100dvh;
      }

      /* "Déplie" le wrapper controls-row : ses enfants rejoignent #app */
      #controls-row { display: contents; }

      #panel-left {
        flex: 0 0 auto;
        order: 1;
        padding: 8px 6px 8px 10px;
        align-items: center;
        justify-content: center;
      }

      #panel-center {
        flex: 1 1 auto;
        width: auto;
        order: 2;
        padding: 4px 6px;
        align-items: center;
        justify-content: center;
        gap: 3px;
        overflow: visible;
      }

      #panel-right {
        flex: 0 0 auto;
        order: 3;
        padding: 8px 10px 8px 6px;
        align-items: center;
        justify-content: center;
      }

      h1 { font-size: 0.75rem; letter-spacing: 3px; }
      .hud-box { padding: 3px 6px; min-width: 58px; }
      .hud-value { font-size: 0.65rem; }
      .hud-label { font-size: 0.32rem; }

      #dpad {
        grid-template-columns: repeat(3, 46px);
        grid-template-rows: repeat(3, 46px);
        gap: 3px;
      }

      .action-btn { width: 62px; height: 62px; font-size: 0.85rem; }
      #speed-bar-wrap { gap: 2px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- CENTRE -->
  <div id="panel-center">

    <div id="header">
      <h1>TETRIS</h1>
      <div id="hud">
        <div class="hud-box">
          <div class="hud-label">SCORE</div>
          <div class="hud-value" id="score-val">0</div>
        </div>
      </div>
    </div>

    <div id="game-area">
      <div id="canvas-container">
        <canvas id="board"></canvas>
        <div id="overlay">
          <div id="overlay-title">TETRIS</div>
          <div id="overlay-score" style="display:none">
            SCORE<br><span id="final-score">0</span>
          </div>
          <button id="overlay-btn">JOUER</button>
        </div>
      </div>
      <div id="side">
        <div class="side-label">NEXT</div>
        <canvas id="next-canvas"></canvas>
      </div>
    </div>

    <div id="speed-bar-wrap">
      <div id="speed-label">VITESSE ▸</div>
      <div id="speed-bar-bg"><div id="speed-bar-fill"></div></div>
    </div>

    <div id="pause-bar">
      <button id="btn-pause">⏸ PAUSE</button>
    </div>

  </div>

  <!-- CONTRÔLES BAS (portrait) / CÔTÉS (paysage) -->
  <div id="controls-row">

    <!-- GAUCHE : D-PAD -->
    <div id="panel-left">
      <div id="dpad">
        <div class="dpad-corner"></div>
        <button class="dpad-btn" id="btn-up">▲</button>
        <div class="dpad-corner"></div>
        <button class="dpad-btn" id="btn-left">◀</button>
        <div class="dpad-btn dpad-corner" id="dpad-center"></div>
        <button class="dpad-btn" id="btn-right">▶</button>
        <div class="dpad-corner"></div>
        <button class="dpad-btn" id="btn-down">▼▼</button>
        <div class="dpad-corner"></div>
      </div>
      <div class="dpad-hint">▼▼ CHUTE RAPIDE</div>
    </div>

    <!-- DROITE : bouton rotation -->
    <div id="panel-right">
      <div id="action-btns">
        <button class="action-btn" id="btn-rotate">
          ↻
          <span class="btn-sub">TOUR</span>
        </button>
      </div>
    </div>

  </div>

  <!-- ── Overlay rotation portrait ─────────────────────────────── -->
  <div id="rotate-screen">
    <!-- Téléphone SVG animé qui tourne de portrait → paysage -->
    <svg id="rotate-icon" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <!-- Corps du téléphone -->
      <rect x="23" y="6" width="34" height="57" rx="6"
            fill="#12122a" stroke="#00f0f0" stroke-width="2.5"/>
      <!-- Écran -->
      <rect x="28" y="14" width="24" height="38" rx="2" fill="#050510"/>
      <!-- Bouton home -->
      <circle cx="40" cy="57" r="3.5" fill="none" stroke="#2a2a55" stroke-width="1.8"/>
      <!-- Pièce Tetris I sur l'écran -->
      <rect x="31" y="20" width="6" height="6" rx="1" fill="#00f0f0" opacity=".9"/>
      <rect x="31" y="27" width="6" height="6" rx="1" fill="#f0c000" opacity=".9"/>
      <rect x="31" y="34" width="6" height="6" rx="1" fill="#a020f0" opacity=".9"/>
      <rect x="31" y="41" width="6" height="6" rx="1" fill="#00e000" opacity=".9"/>
      <!-- Flèche rotation -->
      <path d="M 14 40 A 26 26 0 0 1 66 40"
            fill="none" stroke="#ff0066" stroke-width="2.5"
            stroke-linecap="round" stroke-dasharray="4,3"/>
      <polygon points="66,40 58,34 62,46" fill="#ff0066"/>
    </svg>
    <div id="rotate-label">TOURNEZ<br>VOTRE TÉLÉPHONE</div>
    <div id="rotate-sub">MEILLEURE EXPÉRIENCE EN PAYSAGE</div>
    <button id="btn-continue-portrait">CONTINUER EN PORTRAIT</button>
  </div>

  <!-- ── Combo plein-écran ───────────────────────────────────────── -->
  <div id="combo-overlay" class="hidden">
    <div id="combo-text"></div>
    <div id="combo-pts"></div>
  </div>

</div>

<script>
(() => {
  'use strict';

  const COLS = 10, ROWS = 20;
  const LOCK_DELAY = 450;
  const FAST_INTERVAL = 45;

  const COLORS = [
    null,
    '#00f0f0','#f0c000','#a020f0','#00e000',
    '#f02020','#2020f0','#f07800',
  ];

  const PIECES = [
    null,
    [[1,1,1,1]],
    [[2,2],[2,2]],
    [[0,3,0],[3,3,3]],
    [[0,4,4],[4,4,0]],
    [[5,5,0],[0,5,5]],
    [[6,0,0],[6,6,6]],
    [[0,0,7],[7,7,7]],
  ];

  const boardEl = document.getElementById('board');
  const ctx     = boardEl.getContext('2d');
  const nextEl  = document.getElementById('next-canvas');
  const nctx    = nextEl.getContext('2d');

  let CELL = 28;

  // ── Taille cellules ────────────────────────────────────────────────
  function calcCell() {
    const isLandscape = window.innerWidth > window.innerHeight;
    if (isLandscape) {
      return Math.max(14, Math.floor((window.innerHeight - 90) / ROWS));
    } else {
      const app = document.getElementById('app');
      // Largeur : le canvas principal (COLS) + le canvas NEXT (4) partagent la même ligne
      // 28 = gap(6) + bordures(6) + padding app(16)
      const cellW = Math.max(14, Math.floor((app.clientWidth - 28) / (COLS + 4)));
      // Hauteur : réserver ≈95px (header+barre+pause) + ≈178px (contrôles D-pad+padding)
      const cellH = Math.max(14, Math.floor((window.innerHeight - 273) / ROWS));
      return Math.min(cellW, cellH);
    }
  }

  function resizeCanvases() {
    CELL = calcCell();
    boardEl.width  = CELL * COLS;
    boardEl.height = CELL * ROWS;
    nextEl.width   = CELL * 4;
    nextEl.height  = CELL * 4;
  }

  resizeCanvases();
  window.addEventListener('resize', () => { resizeCanvases(); draw(); drawNext(); });

  // ══ AUDIO (Web Audio API) ════════════════════════════════════════
  let audioCtx = null;

  // Crée le contexte audio au premier geste utilisateur
  function initAC() {
    if (audioCtx) return audioCtx;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    return audioCtx;
  }

  // Appelé sur chaque geste utilisateur pour débloquer le contexte (mobile)
  function resumeAC() {
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playSound(type, param) {
    const ac = initAC();
    if (!ac) return;

    // Planifie les notes ; si le contexte est suspendu, attend le resume()
    const schedule = () => {
      const now = ac.currentTime;

      function note(freq, waveType, vol, dur, freqTo, startDelay) {
        const t = now + (startDelay || 0);
        const osc  = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.type = waveType || 'sine';
        osc.frequency.setValueAtTime(freq, t);
        if (freqTo) osc.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.start(t);
        osc.stop(t + dur + 0.01);
      }

      switch (type) {
        case 'move':
          note(320, 'square', 0.22, 0.06, 220);
          break;
        case 'rotate':
          note(620, 'square', 0.28, 0.09, 920);
          note(310, 'sine',   0.18, 0.07, 180, 0.03);
          break;
        case 'lock':
          note(180, 'sawtooth', 0.35, 0.16, 70);
          note(90,  'square',   0.25, 0.13, 55, 0.05);
          break;
        case 'clear': {
          const n = Math.min(param || 1, 4);
          const freqs = [330, 440, 660, 880];
          for (let i = 0; i < n; i++) {
            note(freqs[i],       'square',   0.38, 0.24, freqs[i] * 2, i * 0.09);
            note(freqs[i] * 0.5, 'sawtooth', 0.22, 0.20, freqs[i],     i * 0.09);
          }
          if (n >= 4) note(1000, 'sawtooth', 0.45, 0.55, 100);
          break;
        }
        case 'gameover':
          note(440, 'sawtooth', 0.42, 1.6, 50);
          note(220, 'square',   0.32, 1.3, 28, 0.12);
          note(660, 'sine',     0.28, 0.9, 110, 0.22);
          break;
      }
    };

    if (ac.state === 'running') {
      schedule();
    } else {
      ac.resume().then(schedule);
    }
  }

  // ══ PARTICULES ═══════════════════════════════════════════════════
  let particles = [];

  function spawnParticles(clearedRows, capturedGrid) {
    const perCell = clearedRows.length >= 4 ? 6 : clearedRows.length >= 2 ? 4 : 3;

    for (const row of clearedRows) {
      for (let col = 0; col < COLS; col++) {
        const cid = capturedGrid[row][col];
        if (!cid) continue;
        const color = COLORS[cid];
        const cx = (col + 0.5) * CELL;
        const cy = (row + 0.5) * CELL;

        for (let i = 0; i < perCell; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = (Math.random() * 3 + 1) * CELL * 0.07;
          particles.push({
            x: cx, y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - CELL * 0.06,
            color,
            size: (Math.random() * 0.22 + 0.1) * CELL,
            life: 1.0,
            decay: 0.025 + Math.random() * 0.03,
          });
        }
      }
    }
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += 0.18;
      p.vx *= 0.97;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const s = p.size * p.life;
      ctx.globalAlpha = Math.min(1, p.life * 1.5);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  }

  // ── État du jeu ───────────────────────────────────────────────────
  let grid, score, state;
  let current, curX, curY, nextPiece;
  let lockPending = false, lockTimer = null;
  let animFrame, lastTime = 0, dropAccum = 0;
  let fastDropActive = false, fastInterval = null;

  function dropInterval() { return Math.max(80, 1000 - score * 10); }
  function speedPct()     { return Math.min(100, Math.round(score * 10 / 9.2)); }
  function newGrid()      { return Array.from({ length: ROWS }, () => new Array(COLS).fill(0)); }

  function randPiece() {
    const id = Math.ceil(Math.random() * 7);
    return PIECES[id].map(r => [...r]);
  }

  function initGame() {
    grid = newGrid();
    score = 0;
    particles = [];
    updateHUD();
    nextPiece = randPiece();
    spawnPiece();
    state = 'playing';
    lastTime = 0; dropAccum = 0;
    cancelAnimationFrame(animFrame);
    animFrame = requestAnimationFrame(loop);
  }

  function spawnPiece() {
    current = nextPiece;
    nextPiece = randPiece();
    curX = Math.floor((COLS - current[0].length) / 2);
    curY = 0;
    lockPending = false;
    if (collides(current, curX, curY)) {
      state = 'gameover';
      playSound('gameover');
      showOverlay('GAME OVER', true);
    }
    drawNext();
  }

  // ── Collision ─────────────────────────────────────────────────────
  function collides(piece, px, py) {
    for (let r = 0; r < piece.length; r++)
      for (let c = 0; c < piece[r].length; c++)
        if (piece[r][c]) {
          const nx = px + c, ny = py + r;
          if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
          if (ny >= 0 && grid[ny][nx]) return true;
        }
    return false;
  }

  // ── Rotation ──────────────────────────────────────────────────────
  function rotate(piece) {
    const rows = piece.length, cols = piece[0].length;
    const res = Array.from({ length: cols }, () => new Array(rows).fill(0));
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        res[c][rows - 1 - r] = piece[r][c];
    return res;
  }

  function tryRotate() {
    const rot = rotate(current);
    for (const k of [0, -1, 1, -2, 2]) {
      if (!collides(rot, curX + k, curY)) {
        current = rot; curX += k; onMove();
        playSound('rotate');
        return;
      }
    }
  }

  // ── Déplacement ───────────────────────────────────────────────────
  function moveLeft() {
    if (!collides(current, curX-1, curY)) { curX--; onMove(); playSound('move'); }
  }
  function moveRight() {
    if (!collides(current, curX+1, curY)) { curX++; onMove(); playSound('move'); }
  }

  function moveDown() {
    if (!collides(current, curX, curY+1)) { curY++; lockPending = false; return true; }
    scheduleLock(); return false;
  }

  function onMove() {
    if (!collides(current, curX, curY+1)) lockPending = false;
    else scheduleLock();
  }

  function scheduleLock() {
    if (!lockPending) {
      lockPending = true;
      clearTimeout(lockTimer);
      lockTimer = setTimeout(lockPiece, LOCK_DELAY);
    }
  }

  function lockPiece() {
    lockPending = false;
    playSound('lock');
    for (let r = 0; r < current.length; r++)
      for (let c = 0; c < current[r].length; c++)
        if (current[r][c] && curY + r >= 0)
          grid[curY + r][curX + c] = current[r][c];
    clearLines();
    spawnPiece();
  }

  function clearLines() {
    // Capturer la grille AVANT suppression pour les particules
    const snap = grid.map(row => [...row]);
    const clearedRows = [];

    for (let r = ROWS - 1; r >= 0; ) {
      if (grid[r].every(v => v)) {
        clearedRows.push(r);
        grid.splice(r, 1);
        grid.unshift(new Array(COLS).fill(0));
      } else r--;
    }

    if (clearedRows.length) {
      const n   = clearedRows.length;
      const pts = n; // +1 par ligne, le multiplicateur ×n s'applique visuellement
      // Correction : les indices dans snap AVANT effacement = r - i (non r + i)
      const adjustedRows = clearedRows.map((r, i) => r - i);
      spawnParticles(adjustedRows, snap);
      playSound('clear', n);
      score += pts;
      updateHUD();
      // Animation combo plein-écran (×1, ×2, ×3, TETRIS!)
      showComboDOM(n, pts);
    }
  }

  // ── Chute rapide ─────────────────────────────────────────────────
  function startFastDrop() {
    if (fastDropActive) return;
    fastDropActive = true;
    moveDown();
    fastInterval = setInterval(() => {
      if (state !== 'playing') return stopFastDrop();
      moveDown();
    }, FAST_INTERVAL);
  }

  function stopFastDrop() {
    fastDropActive = false;
    clearInterval(fastInterval);
    fastInterval = null;
  }

  // ── Ghost ─────────────────────────────────────────────────────────
  function ghostY() {
    let gy = curY;
    while (!collides(current, curX, gy+1)) gy++;
    return gy;
  }

  // ── Dessin ────────────────────────────────────────────────────────
  function drawBlock(c, x, y, alpha = 1, targetCtx = ctx, cell = CELL) {
    if (!c) return;
    const col = COLORS[c];
    targetCtx.globalAlpha = alpha;
    targetCtx.fillStyle = col;
    targetCtx.fillRect(x*cell+1, y*cell+1, cell-2, cell-2);
    targetCtx.fillStyle = 'rgba(255,255,255,0.3)';
    targetCtx.fillRect(x*cell+1, y*cell+1, cell-2, Math.max(2, Math.floor(cell/8)));
    targetCtx.fillStyle = 'rgba(0,0,0,0.35)';
    targetCtx.fillRect(x*cell+1, (y+1)*cell - Math.max(2, Math.floor(cell/8))-1, cell-2, Math.max(2, Math.floor(cell/8)));
    targetCtx.globalAlpha = 1;
  }

  function draw() {
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, boardEl.width, boardEl.height);

    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 0.5;
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c*CELL,0); ctx.lineTo(c*CELL,boardEl.height); ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0,r*CELL); ctx.lineTo(boardEl.width,r*CELL); ctx.stroke();
    }

    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        drawBlock(grid[r][c], c, r);

    if (state === 'playing' || state === 'paused') {
      const gy = ghostY();
      for (let r = 0; r < current.length; r++)
        for (let c = 0; c < current[r].length; c++)
          if (current[r][c])
            drawBlock(current[r][c], curX+c, gy+r, 0.15);
      for (let r = 0; r < current.length; r++)
        for (let c = 0; c < current[r].length; c++)
          if (current[r][c])
            drawBlock(current[r][c], curX+c, curY+r);
    }

    if (particles.length) drawParticles();
  }

  // ── Combo DOM plein-écran ─────────────────────────────────────────
  const comboOverlay = document.getElementById('combo-overlay');
  const comboTextEl  = document.getElementById('combo-text');
  const comboPtsEl   = document.getElementById('combo-pts');
  const COMBO_COLORS = ['#aaffaa', '#ffee00', '#ff8800', '#00f0f0'];
  let   comboTimer   = null;

  function showComboDOM(n, pts) {
    const color    = COMBO_COLORS[Math.min(n - 1, 3)];
    const mainText = n >= 4 ? 'TETRIS!' : `×${n}`;
    const sizes    = ['2.2rem', '2.8rem', '3.4rem', '3rem'];
    const dur      = n === 1 ? 900 : 1800; // ms

    comboTextEl.textContent = mainText;
    comboTextEl.style.color      = color;
    comboTextEl.style.fontSize   = sizes[Math.min(n - 1, 3)];
    comboTextEl.style.textShadow = `0 0 30px ${color}, 0 0 60px ${color}66`;
    comboPtsEl.textContent = `+${pts} pts`;

    // Relancer l'animation en forçant un reflow
    comboOverlay.classList.remove('hidden');
    comboOverlay.style.animation = 'none';
    comboTextEl.style.animation  = 'none';
    void comboOverlay.offsetWidth;
    comboOverlay.style.animation = `combo-fade ${dur}ms ease-out forwards`;
    comboTextEl.style.animation  = `combo-zoom ${dur}ms ease-out forwards`;

    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => comboOverlay.classList.add('hidden'), dur);
  }

  // ── Fenêtre NEXT ─────────────────────────────────────────────────
  function drawNext() {
    const cell = Math.floor(nextEl.width / 4);
    nctx.fillStyle = '#0a0a1e';
    nctx.fillRect(0, 0, nextEl.width, nextEl.height);
    if (!nextPiece) return;
    const ox = Math.floor((4 - nextPiece[0].length) / 2);
    const oy = Math.floor((4 - nextPiece.length) / 2);
    for (let r = 0; r < nextPiece.length; r++)
      for (let c = 0; c < nextPiece[r].length; c++)
        drawBlock(nextPiece[r][c], ox+c, oy+r, 1, nctx, cell);
  }

  // ── HUD ───────────────────────────────────────────────────────────
  function updateHUD() {
    document.getElementById('score-val').textContent = score;
    document.getElementById('speed-bar-fill').style.width = speedPct() + '%';
  }

  // ── Overlay ───────────────────────────────────────────────────────
  const overlay      = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayScore = document.getElementById('overlay-score');
  const finalScore   = document.getElementById('final-score');
  const overlayBtn   = document.getElementById('overlay-btn');

  function showOverlay(title, showScore = false) {
    overlayTitle.textContent = title;
    if (showScore) { overlayScore.style.display = 'block'; finalScore.textContent = score; }
    else           { overlayScore.style.display = 'none'; }
    overlayBtn.textContent = showScore ? 'REJOUER' : 'JOUER';
    overlay.classList.remove('hidden');
  }

  function hideOverlay() { overlay.classList.add('hidden'); }

  // Déblocage audio sur tout geste (capture phase = avant les handlers de jeu)
  document.addEventListener('pointerdown', () => { initAC(); resumeAC(); }, { capture: true, passive: true });
  document.addEventListener('keydown',     () => { initAC(); resumeAC(); }, { capture: true, passive: true });

  overlayBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state === 'paused') {
      togglePause();
    } else {
      hideOverlay();
      initGame();
    }
  });

  // ── Pause ─────────────────────────────────────────────────────────
  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      overlayTitle.textContent = 'PAUSE';
      overlayScore.style.display = 'none';
      overlayBtn.textContent = 'REPRENDRE';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'playing';
      hideOverlay();
      lastTime = performance.now();
      animFrame = requestAnimationFrame(loop);
    }
  }

  document.getElementById('btn-pause').addEventListener('pointerdown', e => {
    e.preventDefault(); togglePause();
  });

  // ── Boucle de jeu ─────────────────────────────────────────────────
  function loop(ts) {
    if (state !== 'playing') { draw(); return; }
    const dt = ts - lastTime;
    lastTime = ts;
    if (!fastDropActive) {
      dropAccum += dt;
      if (dropAccum >= dropInterval()) { dropAccum = 0; moveDown(); }
    } else {
      dropAccum = 0;
    }
    updateParticles();
    draw();
    animFrame = requestAnimationFrame(loop);
  }

  // ── Clavier ───────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (state !== 'playing' && e.key !== 'p' && e.key !== 'P') return;
    switch (e.key) {
      case 'ArrowLeft':  e.preventDefault(); moveLeft();      break;
      case 'ArrowRight': e.preventDefault(); moveRight();     break;
      case 'ArrowUp':    e.preventDefault(); tryRotate();     break;
      case 'ArrowDown':  e.preventDefault(); startFastDrop(); break;
      case ' ':          e.preventDefault(); startFastDrop(); break;
      case 'p': case 'P': togglePause(); break;
    }
    draw();
  });
  document.addEventListener('keyup', e => {
    if (e.key === 'ArrowDown' || e.key === ' ') stopFastDrop();
  });

  // ── Liaisons boutons ──────────────────────────────────────────────
  function bindBtn(id, onDown, onUp = null, repeat = false) {
    const el = document.getElementById(id);
    let iv;
    const down = e => {
      e.preventDefault();
      if (state !== 'playing') return;
      el.classList.add('pressed');
      onDown();
      if (repeat) iv = setInterval(onDown, 110);
    };
    const up = () => {
      el.classList.remove('pressed');
      clearInterval(iv);
      if (onUp) onUp();
    };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointerleave', up);
    el.addEventListener('pointercancel', up);
  }

  bindBtn('btn-left',   moveLeft,      null,         true);
  bindBtn('btn-right',  moveRight,     null,         true);
  bindBtn('btn-up',     tryRotate);
  bindBtn('btn-rotate', tryRotate);
  bindBtn('btn-down',   startFastDrop, stopFastDrop);  // maintenir = chute rapide

  // ── Écran rotation portrait ───────────────────────────────────────
  const rotateScreen = document.getElementById('rotate-screen');
  let   rotateDismissed = false;

  function updateRotateScreen() {
    const isPortrait = window.innerWidth <= window.innerHeight;
    if (isPortrait && !rotateDismissed) {
      rotateScreen.classList.add('visible');
    } else {
      rotateScreen.classList.remove('visible');
    }
  }

  document.getElementById('btn-continue-portrait').addEventListener('pointerdown', e => {
    e.preventDefault();
    rotateDismissed = true;
    rotateScreen.classList.remove('visible');
  });

  window.addEventListener('resize', updateRotateScreen);

  // ── Init ──────────────────────────────────────────────────────────
  state = 'idle';
  grid = newGrid();
  nextPiece = randPiece();
  drawNext();
  draw();
  showOverlay('TETRIS');
  updateRotateScreen(); // afficher l'écran rotation si nécessaire

})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
