<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitBook – Gestion des rendez-vous</title>
  <style>
    /* ── Variables ── */
    :root {
      --primary:   #e63946;
      --primary-dk:#c1121f;
      --bg:        #f1f3f5;
      --surface:   #ffffff;
      --border:    #dee2e6;
      --text:      #212529;
      --muted:     #6c757d;
      --success:   #2a9d8f;
      --radius:    10px;
      --shadow:    0 2px 12px rgba(0,0,0,.08);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    header svg { flex-shrink: 0; }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: .5px; }
    header p  { font-size: .85rem; opacity: .85; margin-top: 2px; }

    /* ── Layout ── */
    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.25rem;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    @media (max-width: 780px) {
      main { grid-template-columns: 1fr; }
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
    }
    .card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      padding-bottom: .75rem;
      border-bottom: 2px solid var(--primary);
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 1rem; }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: .35rem;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    input, select, textarea {
      width: 100%;
      padding: .6rem .85rem;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: .95rem;
      color: var(--text);
      background: var(--bg);
      transition: border-color .2s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      background: #fff;
    }
    textarea { resize: vertical; min-height: 70px; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }

    /* ── Button ── */
    button[type="submit"] {
      width: 100%;
      padding: .75rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: .5rem;
      transition: background .2s, transform .1s;
    }
    button[type="submit"]:hover  { background: var(--primary-dk); }
    button[type="submit"]:active { transform: scale(.98); }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--success);
      color: #fff;
      padding: .75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s;
      z-index: 999;
    }
    #toast.show { opacity: 1; }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: .75rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }
    .filters input, .filters select {
      flex: 1;
      min-width: 140px;
      font-size: .875rem;
    }

    /* ── Stats row ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .75rem;
      margin-bottom: 1.25rem;
    }
    .stat {
      background: var(--bg);
      border-radius: 8px;
      padding: .75rem 1rem;
      text-align: center;
    }
    .stat span { display: block; }
    .stat .val  { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .stat .lbl  { font-size: .75rem; color: var(--muted); margin-top: 2px; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .875rem;
    }
    thead tr { background: var(--bg); }
    th, td {
      padding: .65rem .9rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    tbody tr:hover { background: #fef2f2; }

    /* ── Badge ── */
    .badge {
      display: inline-block;
      padding: .2rem .55rem;
      border-radius: 50px;
      font-size: .72rem;
      font-weight: 600;
    }
    .badge-musculation { background:#fde8e8; color:#c00; }
    .badge-cardio      { background:#e8f4fd; color:#0070b8; }
    .badge-yoga        { background:#e8fdf5; color:#00785a; }
    .badge-pilates     { background:#f9e8fd; color:#7800b8; }
    .badge-boxe        { background:#fff3e8; color:#b86000; }
    .badge-natation    { background:#e8eafd; color:#2a00b8; }
    .badge-autre       { background:#f0f0f0; color:#444; }

    /* ── Delete btn ── */
    .btn-del {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: .2rem .4rem;
      border-radius: 4px;
      transition: color .15s, background .15s;
      font-size: 1rem;
      line-height: 1;
    }
    .btn-del:hover { color: var(--primary); background: #fde8e8; }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }
    .empty svg { opacity: .35; margin-bottom: .75rem; }
    .empty p { font-size: .95rem; }
  </style>
</head>
<body>

<!-- ════════════════════════ HEADER ════════════════════════ -->
<header>
  <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 6.5h11M6.5 12h11M6.5 17.5h11"/><rect x="3" y="4" width="18" height="16" rx="2"/>
  </svg>
  <div>
    <h1>FitBook</h1>
    <p>Gestion des rendez-vous – Salle de sport</p>
  </div>
</header>

<!-- ════════════════════════ MAIN ════════════════════════ -->
<main>

  <!-- ── Formulaire ── -->
  <section class="card">
    <h2>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      Nouveau rendez-vous
    </h2>

    <form id="appointmentForm" novalidate>

      <div class="form-group">
        <label for="clientName">Nom du client</label>
        <input id="clientName" type="text" placeholder="Ex : Marie Dupont" required />
      </div>

      <div class="form-group">
        <label for="coach">Coach / intervenant</label>
        <input id="coach" type="text" placeholder="Ex : Thomas Martin" />
      </div>

      <div class="form-group">
        <label for="activity">Activité</label>
        <select id="activity" required>
          <option value="" disabled selected>Choisir une activité…</option>
          <option value="musculation">Musculation</option>
          <option value="cardio">Cardio</option>
          <option value="yoga">Yoga</option>
          <option value="pilates">Pilates</option>
          <option value="boxe">Boxe / MMA</option>
          <option value="natation">Natation</option>
          <option value="autre">Autre</option>
        </select>
      </div>

      <div class="row-2">
        <div class="form-group">
          <label for="date">Date</label>
          <input id="date" type="date" required />
        </div>
        <div class="form-group">
          <label for="time">Heure</label>
          <input id="time" type="time" required />
        </div>
      </div>

      <div class="form-group">
        <label for="duration">Durée (minutes)</label>
        <select id="duration">
          <option value="30">30 min</option>
          <option value="45">45 min</option>
          <option value="60" selected>60 min</option>
          <option value="90">90 min</option>
          <option value="120">120 min</option>
        </select>
      </div>

      <div class="form-group">
        <label for="notes">Notes (optionnel)</label>
        <textarea id="notes" placeholder="Informations complémentaires…"></textarea>
      </div>

      <button type="submit">Ajouter le rendez-vous</button>
    </form>
  </section>

  <!-- ── Liste ── -->
  <section class="card">
    <h2>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      Rendez-vous planifiés
    </h2>

    <!-- Stats -->
    <div class="stats">
      <div class="stat">
        <span class="val" id="statTotal">0</span>
        <span class="lbl">Total</span>
      </div>
      <div class="stat">
        <span class="val" id="statToday">0</span>
        <span class="lbl">Aujourd'hui</span>
      </div>
      <div class="stat">
        <span class="val" id="statWeek">0</span>
        <span class="lbl">Cette semaine</span>
      </div>
    </div>

    <!-- Filtres -->
    <div class="filters">
      <input id="searchInput" type="text" placeholder="Rechercher un client…" />
      <select id="filterActivity">
        <option value="">Toutes les activités</option>
        <option value="musculation">Musculation</option>
        <option value="cardio">Cardio</option>
        <option value="yoga">Yoga</option>
        <option value="pilates">Pilates</option>
        <option value="boxe">Boxe / MMA</option>
        <option value="natation">Natation</option>
        <option value="autre">Autre</option>
      </select>
      <input id="filterDate" type="date" title="Filtrer par date" />
    </div>

    <!-- Tableau -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Client</th>
            <th>Activité</th>
            <th>Date</th>
            <th>Heure</th>
            <th>Durée</th>
            <th>Coach</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="appointmentTable"></tbody>
      </table>
      <div id="emptyState" class="empty" style="display:none;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <p>Aucun rendez-vous trouvé.</p>
      </div>
    </div>
  </section>

</main>

<!-- Toast notification -->
<div id="toast">✓ Rendez-vous ajouté !</div>

<script>
(function () {
  'use strict';

  // ── Storage ──────────────────────────────────────────────
  const KEY = 'fitbook_appointments';

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch { return []; }
  }

  function save(data) {
    localStorage.setItem(KEY, JSON.stringify(data));
  }

  let appointments = load();

  // ── Helpers ───────────────────────────────────────────────
  function fmtDate(iso) {
    if (!iso) return '—';
    const [y, m, d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }

  function todayISO() {
    return new Date().toISOString().slice(0, 10);
  }

  function weekRange() {
    const now = new Date();
    const day = now.getDay() === 0 ? 6 : now.getDay() - 1; // Monday=0
    const mon = new Date(now); mon.setDate(now.getDate() - day);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return [mon.toISOString().slice(0, 10), sun.toISOString().slice(0, 10)];
  }

  function activityLabel(v) {
    const map = {
      musculation:'Musculation', cardio:'Cardio', yoga:'Yoga',
      pilates:'Pilates', boxe:'Boxe / MMA', natation:'Natation', autre:'Autre'
    };
    return map[v] || v;
  }

  // ── Stats ─────────────────────────────────────────────────
  function updateStats() {
    const today = todayISO();
    const [mon, sun] = weekRange();
    document.getElementById('statTotal').textContent = appointments.length;
    document.getElementById('statToday').textContent =
      appointments.filter(a => a.date === today).length;
    document.getElementById('statWeek').textContent =
      appointments.filter(a => a.date >= mon && a.date <= sun).length;
  }

  // ── Render ────────────────────────────────────────────────
  function render() {
    const search   = document.getElementById('searchInput').value.toLowerCase();
    const actFilt  = document.getElementById('filterActivity').value;
    const dateFilt = document.getElementById('filterDate').value;

    let list = appointments.filter(a => {
      const matchName = a.client.toLowerCase().includes(search) ||
                        (a.coach || '').toLowerCase().includes(search);
      const matchAct  = !actFilt  || a.activity === actFilt;
      const matchDate = !dateFilt || a.date === dateFilt;
      return matchName && matchAct && matchDate;
    });

    // Sort by date + time
    list.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

    const tbody = document.getElementById('appointmentTable');
    tbody.innerHTML = '';

    if (list.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
    } else {
      document.getElementById('emptyState').style.display = 'none';
      list.forEach(a => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${esc(a.client)}</strong></td>
          <td><span class="badge badge-${a.activity}">${activityLabel(a.activity)}</span></td>
          <td>${fmtDate(a.date)}</td>
          <td>${a.time}</td>
          <td>${a.duration} min</td>
          <td>${esc(a.coach || '—')}</td>
          <td>
            <button class="btn-del" data-id="${a.id}" title="Supprimer">✕</button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    updateStats();
  }

  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Delete ────────────────────────────────────────────────
  document.getElementById('appointmentTable').addEventListener('click', e => {
    const btn = e.target.closest('.btn-del');
    if (!btn) return;
    const id = btn.dataset.id;
    appointments = appointments.filter(a => a.id !== id);
    save(appointments);
    render();
  });

  // ── Filters ───────────────────────────────────────────────
  ['searchInput','filterActivity','filterDate'].forEach(id => {
    document.getElementById(id).addEventListener('input', render);
  });

  // ── Form submit ───────────────────────────────────────────
  document.getElementById('appointmentForm').addEventListener('submit', e => {
    e.preventDefault();
    const form = e.target;

    const client   = document.getElementById('clientName').value.trim();
    const coach    = document.getElementById('coach').value.trim();
    const activity = document.getElementById('activity').value;
    const date     = document.getElementById('date').value;
    const time     = document.getElementById('time').value;
    const duration = document.getElementById('duration').value;
    const notes    = document.getElementById('notes').value.trim();

    if (!client || !activity || !date || !time) {
      alert('Veuillez remplir tous les champs obligatoires.');
      return;
    }

    const appt = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      client, coach, activity, date, time, duration, notes,
      createdAt: new Date().toISOString()
    };

    appointments.push(appt);
    save(appointments);
    render();

    form.reset();
    document.getElementById('activity').value = '';

    // Toast
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  });

  // ── Initial render ────────────────────────────────────────
  render();

})();
</script>
</body>
</html>
